name: Bug 报告
description: 报告可以稳定复现的功能、显示或性能问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你帮助 AiPin 变得更可靠。请不要粘贴 API Key、私人对话、附件或包含个人信息的日志。
  - type: input
    id: version
    attributes:
      label: AiPin 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10 22H2
        - 其他或不确定
    validations:
      required: true
  - type: input
    id: dpi
    attributes:
      label: 分辨率与缩放
      placeholder: 例如 2560×1440，150%
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请从启动 AiPin 开始，按顺序描述操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: provider
    attributes:
      label: 相关供应商与模型
      description: 只填写供应商名和模型 ID，不要填写 Key。
  - type: textarea
    id: material
    attributes:
      label: 脱敏截图或诊断信息
      description: 上传前请再次确认没有凭据、对话隐私和本机路径。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经移除 API Key 和个人数据
          required: true
        - label: 我已经搜索过现有 Issue
          required: true
