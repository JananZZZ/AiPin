name: 功能建议
description: 描述一个真实场景和希望 AiPin 提供的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到困难？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
      description: 请先描述结果，不必限定具体实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方式
  - type: textarea
    id: constraints
    attributes:
      label: 供应商、隐私或兼容性约束
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我没有在内容中包含 API Key 或私人对话
          required: true
        - label: 我已经搜索过现有 Issue
          required: true
